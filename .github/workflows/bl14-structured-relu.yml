name: BL-14 structured ReLU development

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/run-bl14-structured-relu.sh'
      - 'experiments/BL-14.2.2-STRUCTURED-RELU-PROTOCOL.md'
      - '.github/workflows/bl14-structured-relu.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'scripts/run-bl14-structured-relu.sh'
      - 'experiments/BL-14.2.2-STRUCTURED-RELU-PROTOCOL.md'
      - '.github/workflows/bl14-structured-relu.yml'

permissions:
  contents: read

jobs:
  numerical-development:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Tests, twelve trials, replay and provenance
        run: bash scripts/run-bl14-structured-relu.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p booleanlab-discovery --bin bl14_structured_relu -- -D warnings
      - name: Archive exact source, dependencies and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bl14-structured-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bl14-structured-evidence/
          if-no-files-found: error
          retention-days: 30
