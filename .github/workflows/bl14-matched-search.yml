name: BL-14 matched topology budget

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  matched-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Matched budgets, numerical checks, replay and legacy parity
        run: bash scripts/check-bl14-matched-search.sh
      - name: Format
        run: |
          # Diagnostic only: never rewrite the tested checkout or weaken the gate.
          rustfmt --edition 2024 --emit stdout crates/booleanlab-discovery/src/bin/support/bl14_matched_search.rs > target/bl14-matched-evidence/rustfmt-diagnostic.rs
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Archive exact source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bl14-matched-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/bl14-matched-evidence/
          if-no-files-found: error
          retention-days: 30
