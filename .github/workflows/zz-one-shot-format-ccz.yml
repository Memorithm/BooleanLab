name: One-shot format BL-13 CCZ screen

on:
  push:
    branches:
      - research/bl13-ccz-invariant-screen

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'CHECKUPAUTO'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply repository rustfmt
        run: cargo fmt --all
      - name: Validate whitespace
        run: git diff --check
      - name: Commit formatting and remove one-shot workflow
        env:
          BRANCH: research/bl13-ccz-invariant-screen
        run: |
          set -euo pipefail
          git config user.name 'ZEKRITI TAREK'
          git config user.email 'contact@checkupauto.fr'
          git rm .github/workflows/zz-one-shot-format-ccz.yml
          git add crates/booleanlab-core/src/vectorial_ccz_screen.rs crates/booleanlab-core/src/lib.rs
          git commit -m 'style(bl13): apply repository rustfmt'
          git push origin "HEAD:${BRANCH}"
