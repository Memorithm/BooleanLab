name: PR71 format export

on:
  push:
    branches:
      - research/bl14-structured-relu-multiregime
    paths:
      - '.github/workflows/pr71-format-export.yml'

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Apply exact review correction and rustfmt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/booleanlab-discovery/src/bin/bl14_structured_relu.rs')
          text = p.read_text()
          old = '//! BL-14.2.2 numerical development: fixed ReLU features, trained readout.'
          new = '//! BL-14.2.2 numerical development: fixed `ReLU` features, trained readout.'
          if text.count(old) != 1:
              raise SystemExit('expected exact ReLU review target not found once')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          mkdir -p target/pr71-format-export
          cp crates/booleanlab-discovery/src/bin/bl14_structured_relu.rs target/pr71-format-export/
          cargo fmt --all -- --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr71-format-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/pr71-format-export/
          if-no-files-found: error
          retention-days: 1
