name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve exact dependency lock
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: BL-0 deterministic smoke experiment
        run: cargo run -p booleanlab-runner --release
      - name: BL-4.4.2 deterministic Hamming frontier calibration
        run: cargo run -p booleanlab-discovery --bin bl4_hamming_frontier --release
      - name: BL-4.5.1 deterministic KV page calibration
        run: cargo run -p booleanlab-discovery --bin bl4_kv_page_calibration --release
      - name: BL-4.6.1 systems evidence contract calibration
        run: cargo run -p booleanlab-discovery --bin bl4_systems_evidence_calibration --release
      - name: BL-13 exact metric calibration
        run: cargo run -p booleanlab-discovery --bin bl13_calibrate --release
      - name: BL-13 Boolean-only reference and Pareto campaign
        run: cargo run -p booleanlab-discovery --bin bl13_boolean_baseline --release
      - name: BL-13 GF(2^8) inversion campaign
        run: cargo run -p booleanlab-discovery --bin bl13_gf2_inversion --release
      - name: BL-14.5 exhaustive versus CEGIS calibration
        run: cargo run --locked -p booleanlab-discovery --bin bl14_search_comparison --release
      - name: BL-14 exact numerical linear-layer calibration
        run: cargo run --locked -p booleanlab-discovery --bin bl14_linear_calibration --release
      - name: BL-14.1.2 trained linear development pilot
        run: cargo run --locked -p booleanlab-discovery --bin bl14_trained_linear --release
      - name: BL-14.3.1 dynamic Boolean routing development pilot
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked -p booleanlab-discovery --bin bl14_structured_relu --release -- --dynamic-routing-v1 > bl14-dynamic-routing-v1.tsv
          cargo run --locked -p booleanlab-discovery --bin bl14_structured_relu --release -- --dynamic-routing-v1 > bl14-dynamic-routing-v1.replay.tsv
          cmp bl14-dynamic-routing-v1.tsv bl14-dynamic-routing-v1.replay.tsv
          grep -Fq '# schema=bl14.dynamic-routing.v1' bl14-dynamic-routing-v1.tsv
          grep -Fq '# ALL_DYNAMIC_CONTROLLERS_FROZEN_BEFORE_VALIDATION' bl14-dynamic-routing-v1.tsv
          grep -Fq '# COMPLETE_TRIALS=12' bl14-dynamic-routing-v1.tsv
          mkdir -p bl14-dynamic-routing-evidence
          cp bl14-dynamic-routing-v1.tsv bl14-dynamic-routing-evidence/report.tsv
          cp bl14-dynamic-routing-v1.replay.tsv bl14-dynamic-routing-evidence/replay.tsv
          cp Cargo.lock bl14-dynamic-routing-evidence/Cargo.lock
          rustc --version --verbose > bl14-dynamic-routing-evidence/rustc-version.txt
          cargo --version --verbose > bl14-dynamic-routing-evidence/cargo-version.txt
          git --version > bl14-dynamic-routing-evidence/git-version.txt
          printf '%s\n' "$SOURCE_HEAD_SHA" > bl14-dynamic-routing-evidence/source-head-sha.txt
          printf '%s\n' "$GITHUB_SHA" > bl14-dynamic-routing-evidence/checkout-sha.txt
          {
            printf 'schema=bl14.dynamic-routing.evidence.v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'source_head_sha=%s\n' "$SOURCE_HEAD_SHA"
            printf 'checkout_sha=%s\n' "$GITHUB_SHA"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          } > bl14-dynamic-routing-evidence/manifest.env
          (
            cd bl14-dynamic-routing-evidence
            sha256sum Cargo.lock cargo-version.txt checkout-sha.txt git-version.txt manifest.env replay.tsv report.tsv rustc-version.txt source-head-sha.txt > SHA256SUMS
          )
      - name: Upload BL-14.3.1 provenance bundle
        uses: actions/upload-artifact@v4
        with:
          name: bl14-dynamic-routing-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: bl14-dynamic-routing-evidence/

  sedenion-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-02
          components: rustfmt, clippy
      - name: Sedenion tests
        run: cargo test -p booleanlab-discovery --features sedenion-experiments
      - name: Sedenion Clippy
        run: cargo clippy -p booleanlab-discovery --features sedenion-experiments --all-targets -- -D warnings
      - name: BL-13.2.0 sedenion predicate control
        run: cargo run -p booleanlab-discovery --features sedenion-experiments --bin bl13_sedenion_control --release
      - name: BL-13.2.1 sedenion full-baseline equivalence screen
        run: cargo run -p booleanlab-discovery --features sedenion-experiments --bin bl13_sedenion_baseline_screen --release
      - name: BL-13.2.1 sedenion input-permutation screen
        run: cargo run -p booleanlab-discovery --features sedenion-experiments --bin bl13_sedenion_permutation_screen --release
