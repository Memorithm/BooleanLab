name: Temporary PR67 artifact cleanup

on:
  push:
    branches:
      - feat/bl-be2-multiword-kleene

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bl-be2-multiword-kleene
      - name: Remove generated build artifacts
        run: |
          rm -rf target Cargo.lock
          rm .github/workflows/tmp-pr67-artifact-cleanup.yml
          git diff --stat
      - name: Commit cleanup
        run: |
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git add -A
          git commit -m "chore(bl-be2): remove generated build artifacts"
          git push origin HEAD:feat/bl-be2-multiword-kleene
