[workspace]
resolver = "2"
members = [
    "crates/booleanlab-core",
    "crates/booleanlab-runner",
]

[workspace.package]
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
