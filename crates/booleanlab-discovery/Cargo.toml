[package]
name = "booleanlab-discovery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
sedenion-experiments = ["dep:scirust-simd"]

[dependencies]
booleanlab-core = { path = "../booleanlab-core" }
scirust-modalg = { git = "https://github.com/Memorithm/scirust", rev = "7178bcfc6800e3277b9f16c3f03c70523b53e2c7" }
scirust-simd = { git = "https://github.com/Memorithm/scirust", rev = "7178bcfc6800e3277b9f16c3f03c70523b53e2c7", optional = true, features = ["portable-simd"] }

[[bin]]
name = "bl13_sedenion_control"
path = "src/bin/bl13_sedenion_control.rs"
required-features = ["sedenion-experiments"]

[[bin]]
name = "bl13_sedenion_baseline_screen"
path = "src/bin/bl13_sedenion_baseline_screen.rs"
required-features = ["sedenion-experiments"]

[lints]
workspace = true
